[package]
name = "snarkos-node-metrics"
version = "3.3.2"
authors = [ "The Aleo Team <hello@aleo.org>" ]
description = "A node for a decentralized operating system"
homepage = "https://aleo.org"
repository = "https://github.com/ProvableHQ/snarkOS"
keywords = [
  "aleo",
  "cryptography",
  "blockchain",
  "decentralized",
  "zero-knowledge"
]
categories = [ "cryptography", "cryptography::cryptocurrencies", "os" ]
license = "Apache-2.0"
edition = "2021"

[features]
default = [ "rayon", "snarkvm/metrics" ]
metrics = [ "snarkvm/metrics" ]
serial = [ "snarkvm/metrics" ]
test_targets = [ "snarkvm/test_targets" ]

[dependencies.metrics-exporter-prometheus]
version = "0.13"

[dependencies.locktick]
version = "0.2"

[dependencies.rayon]
version = "1"
optional = true

[dependencies.snarkvm]
workspace = true
features = [ "metrics" ]

[dependencies.time]
version = "0.3"

[dependencies.tokio]
version = "1.28"
features = [ "rt" ]
