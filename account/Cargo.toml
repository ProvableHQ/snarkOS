[package]
name = "snarkos-account"
version = "3.8.0"
authors = [ "The Aleo Team <hello@aleo.org>" ]
description = "Account for a decentralized operating system"
homepage = "https://aleo.org"
repository = "https://github.com/ProvableHQ/snarkOS"
keywords = [
  "aleo",
  "cryptography",
  "blockchain",
  "decentralized",
  "zero-knowledge"
]
categories = [ "cryptography", "cryptography::cryptocurrencies", "os" ]
license = "Apache-2.0"
edition = "2021"

[features]
cuda = [ "snarkvm/cuda" ]
test_network = [
  "snarkvm/test_consensus_heights",
  "snarkvm/test_targets",
]

[dependencies.anyhow]
version = "1.0.79"

[dependencies.colored]
version = "2"

[dependencies.rand]
version = "0.8"
default-features = false

[dependencies.snarkvm]
workspace = true
features = [ "console" ]
