[package]
name = "timing_analysis"
version = "0.1.0"
edition = "2021"
authors = ["The Aleo Team <hello@aleo.org>"]
description = "Consensus timing analysis tool for snarkOS"
license = "Apache-2.0"

[[bin]]
name = "timing_analysis"
path = "src/main.rs"

[dependencies]
# CLI and argument parsing
clap = { version = "4.4", features = ["derive"] }

# JSON parsing and serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date and time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Visualization
plotters = "0.3"
plotters-svg = "0.3"

# Statistics and math
statrs = "0.16"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Collections and utilities
indexmap = "2.0"
itertools = "0.12"

[dev-dependencies]
tempfile = "3.8"
pretty_assertions = "1.4"