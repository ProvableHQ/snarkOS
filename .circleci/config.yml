# # CircleCI jobs for snarkOS
#
# ## Caching
# This configuration uses sccache to cache build artifacts specific to a job across runs.
# Additionally, it uses workspaces to share artifacts between jobs in the same workflow run. workspaces are discarded after the workflow completes.
#
# ## Linux Workflow
# The Linux jobs work as follows, with exception of a few (account, cli, and node).
# 1. prepare-repository:
#   Fetches the repository and sccache, and runs cargo fetch to download all dependencies.
#   It then stores ~/.cargo, ~/.bin, and ./target in the workspace.
#   All following steps use this workspace
# 
# 2.1 install-snarkos:
#   Builds snarkos in release mode and installs it.
##
# 2.1 Unit/Integration tests
#   Builds a package-specific set of tests and runs them.
#
# 2.2 Checks
#   Runs checks on the code, such as cargo clippy.
#
# 3 Devnet tests
#   Uses the state generated by install-snarkos to run devnet tests without building anything.
#
# ## Windows Workflow
# TODO

version: 2.1

parameters:
  medium:
    type: string
    default: medium
  large:
    type: string
    default: large
  xlarge:
    type: string
    default: xlarge
  twoxlarge:
    type: string
    default: 2xlarge

orbs:
  windows: circleci/windows@5.0

executors:
  # The default docker image used in the main-workflow
  rust-docker:
     docker:
      - image: cimg/rust:1.88.0 # Attention - Change the MSRV in Cargo.toml and rust-toolchain as well

commands:
  # Check that compilation works on windows (using cargo check)
  check_windows:
    description: "Runs cargo check on Windows"
    parameters:
      workspace_member:
        type: string
    steps:
      - checkout
      - restore_cache:
          keys:
            - cargo-cache-{{ arch }}-{{ checksum "Cargo.lock" }}
            - cargo-cache-{{ arch }}- # fallback to an older version
      - run:
          name: "Install Rust and run cargo check"
          command: |
            $ProgressPreference = "SilentlyContinue"
            # Remove the circleci installed rustc.
            choco uninstall rust
            # Install llvm (libclang for rocksdb).
            choco install llvm -y 
            refreshenv
            # Install rust with rustup.
            Invoke-WebRequest -Uri "https://win.rustup.rs/" -OutFile "C:\rustup-init.exe"
            & C:\rustup-init.exe -y --default-toolchain "1.88.0-x86_64-pc-windows-msvc" --no-modify-path --profile minimal # Attention - Change the MSRV in Cargo.toml and rust-toolchain as well
            $Env:Path += ";$Env:USERPROFILE\.cargo\bin"
            # Verify the installation.
            cargo --version --verbose
            rustc --version | Out-File -FilePath "rust-version"
            if (!(Test-Path "Cargo.lock" -PathType Leaf)) {
                cargo generate-lockfile
            }
            cd << parameters.workspace_member >>
            cargo check --examples --benches --tests
      - save_cache:
          paths:
            - C:\Users\circleci\.cargo\registry
            - C:\Users\circleci\.cargo\git
            - target
          key: cargo-cache-{{ arch }}-{{ checksum "Cargo.lock" }}

  setup_environment:
    description: "Setup testing environment"
    parameters:
      cache_key:
        type: string
        default: v3.3.1-rust-1.88.0-snarkos-stable-cache
    steps:
      - run:
          name: "Setup GCP"
          command: |
            curl https://packages.cloud.google.com/apt/doc/apt-key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/cloud.google.gpg
            echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" | sudo tee -a /etc/apt/sources.list.d/google-cloud-sdk.list
            sudo apt-get update
            sudo apt-get install google-cloud-cli -y
            echo $GCLOUD_SERVICE_KEY > /home/circleci/gcloud-key.json
            gcloud auth activate-service-account --key-file=/home/circleci/gcloud-key.json
            gcloud config set project protocol-development-sandbox
      - run:
          name: Set environment variables
          command: |
            # CircleCI runs a new shell for every step, so exported variables are lost
            # This workaround is suggested here: https://circleci.com/docs/env-vars/#parameters-and-bash-environment
            echo 'set -e' >> "$BASH_ENV"
            echo 'export SCCACHE_CACHE_SIZE=10G' >> "$BASH_ENV"
            echo 'export SCCACHE_GCS_KEY_PATH=/home/circleci/gcloud-key.json' >> "$BASH_ENV"
            echo 'export SCCACHE_GCS_BUCKET=ci_sccache' >> "$BASH_ENV"
            echo 'export SCCACHE_GCS_RW_MODE=READ_WRITE' >> "$BASH_ENV"
            echo 'export RUSTC_WRAPPER="$CIRCLE_WORKING_DIRECTORY/.bin/sccache"' >> "$BASH_ENV"
            # Disable incremental builds so that sccache works as expected
            echo 'export CARGO_INCREMENTAL=0' >> "$BASH_ENV"
      - run:
          name: Install sccache
          command: |
            mkdir -p ~/.bin
            export SCCACHE_VERSION=v0.10.0
            export SCCACHE_PKG="sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl"
            wget https://github.com/mozilla/sccache/releases/download/${SCCACHE_VERSION}/${SCCACHE_PKG}.tar.gz
            tar -xvf ${SCCACHE_PKG}.tar.gz
            mv ${SCCACHE_PKG}/sccache ~/.bin/sccache
            rm -rf ${SCCACHE_PKG}

  # Set enviornment variables needed for sccache to work correctly
  set_environment_vars:
    description: "Set all needed environement variables"
    parameters:
      cache_size:
          type: string
          default: 200M
    steps:
      - run: set -e
      - run:
          name: Setup environment variables
          command: |
            # CircleCI runs a new shell for every step, so exported variables are los
            # This workaround is suggested here: https://circleci.com/docs/env-vars/#parameters-and-bash-environment
            echo 'set -e' >> "$BASH_ENV"
            echo 'export SCCACHE_CACHE_SIZE=<< parameters.cache_size >>' >> "$BASH_ENV"
            echo 'export SCCACHE_DIR="/home/circleci/.cache/sccache"' >> "$BASH_ENV"
            echo 'export RUSTC_WRAPPER="/home/circleci/.bin/sccache"' >> "$BASH_ENV"

  install_debian_packages:
    description: "Install Debian packages"
    steps:
      - run:
          name: Install Debian packages
          command: |
            DEBIAN_FRONTEND=noninteractive sudo apt-get update
            DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends clang llvm-dev llvm lld pkg-config xz-utils make libssl-dev libssl-dev
            DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends clang llvm-dev llvm pkg-config xz-utils make libssl-dev libssl-dev
      - fetch_cache:
          cache_key: << parameters.cache_key >>

  fetch_cache:
    description: "Fetch the cached data"
    parameters:
      cache_key:
        type: string
    steps:
      - run:
          name: Generate daily cache key
          command: |
            CACHE_DATE=$(date +%Y-%m-%d)
            echo "Cache date is $CACHE_DATE"
            echo "$CACHE_DATE" >> cache-key-suffix
      - restore_cache:
          keys:
            - << parameters.cache_key >>-{{ checksum "cache-key-suffix" }}
            - << parameters.cache_key >>-  # fallback to a different day

  # Store sccache folder
  # For tests, we build with --frozen, so .cargo is not needed
  store_cache:
    description: "Store the updated cache (once per day)"
    parameters:
      cache_key:
        type: string
    steps:
      - run:
          name: Show sccache statistics
          command: /home/circleci/.bin/sccache -s
      - save_cache:
          key: << parameters.cache_key >>-{{ checksum "cache-key-suffix" }}
          paths:
            - .cargo

  # Store sccache and cargo folders
  store_cache_with_cargo:
    description: "Store the updated cache (once per day)"
    parameters:
      cache_key:
        type: string
        default: v4.0.0-rust-1.88.0-snarkos-stable-cache
    steps:
      - run:
          name: Show sccache statistics
          command: /home/circleci/.bin/sccache -s
      - save_cache:
          key: << parameters.cache_key >>-{{ checksum "cache-key-suffix" }}
          paths:
            - ~/.cache/sccache
            - ~/.cargo

  # Run unit tests for the specified package
  run_test:
    description: "Build and run tests"
    parameters:
      workspace_member:
        type: string
      flags:
        type: string
        default: ""
      extra_build_flags:
        type: string
        default: ""
    steps:
      - checkout
      - setup_environment:
          cache_key:  v4.0.0-rust-1.88.0-<< parameters.workspace_member >>-cache
      - run:
          name: Build Tests
          timeout: 15m
          command: cargo test --package=<< parameters.workspace_member >> --locked --no-run << parameters.flags >> << parameters.extra_build_flags >>
      - run:
          name: Run Tests
          timeout: 15m
          command: cargo test --package=<< parameters.workspace_member >> --locked << parameters.flags >>
      - clear_environment:
          cache_key: v4.0.0-rust-1.88.0-<< parameters.workspace_member >>-cache

  run_devnet:
    description: "Run devnet for integration testing"
    parameters:
      validators:
        type: integer
        default: 4
      clients:
        type: integer
        default: 2
      network_id:
        type: integer
        default: 0
      min_height:
        type: integer
        default: 45
    steps:
      - set_environment_vars
      - attach_workspace:
          at: /home/circleci
      - run:
          name: "Run DB backup test"
          timeout: 10m  # Allow 10 minutes total
          command: |
            ./.circleci/db_backup_ci.sh # run the db checkpoint test script first, and clean the dev ledgers afterwards
            snarkos clean --dev 0
            snarkos clean --dev 1
            snarkos clean --dev 2
            snarkos clean --dev 3
      - run:
          name: "Run block advancement test"
          imeout: 20m  # Allow 20 minutes total
          command: |
            ./.circleci/devnet_ci.sh << parameters.validators >> << parameters.clients >> << parameters.network_id >> << parameters.min_height >>

  install_rust_nightly:
    description: "Install Rust nightly toolchain"
    steps:
      - run: rustup toolchain install nightly-x86_64-unknown-linux-gnu

  # Fetches the pre-processed repository and sccache from the workspace
  # This does not perform a git checkout, but uses the source code stored
  # in the workspace by prepare-repository.
  fetch_repository:
    description: Fetch the cached repository from the workspace
    parameters:
      cache_key:
        type: string
        default: snarkos-rust-1.83.0-cache
      cache_size:
          type: string
          default: 200M
    steps:
      - set_environment_vars:
          cache_size: << parameters.cache_size >>
      - install_debian_packages
      - attach_workspace:
          at: /home/circleci
      - fetch_cache:
          cache_key: << parameters.cache_key >>
 
jobs:
  # Fetches the repository and run cargo check on all targets.
  # This populates ./target and ~/.cargo from which other tests and checks can continue.
  prepare-repository:
    executor: rust-docker
    resource_class: << pipeline.parameters.twoxlarge >>
    description: "Fetch the git repository and store it in the workspace"
    steps:
      - set_environment_vars:
          cache_size: 2G
      - checkout
      - install_sccache
      - install_debian_packages 
      - fetch_cache:
          cache_key: prepare-repository-rust-1.83.0-cache
      - run:
          name: Remove git folder
          command: rm -rf .git
      - run:
          name: Fetch dependencies
          no_output_timeout: 10m
          command: cargo fetch --locked
      - persist_to_workspace:
          root: /home/circleci
          paths:
            - project
            - .bin
            - .cargo
      - run:
          name: Show sccache statistics
          command: /home/circleci/.bin/sccache -s
      # Store entire target folder to speed up this process
      - save_cache:
          key: prepare-repository-rust-1.83.0-cache-{{ checksum "cache-key-suffix" }}
          paths:
            - ~/.cargo
            - ~/.cache/sccache
            - ~/project/target

  # Builds the snarkos binary and installs it in ~/.cargo/bin.
  # It then caches ~/.cargo so that jobs that use the binary do not have
  # to build anything.
  install-snarkos:
    executor: rust-docker
    resource_class: << pipeline.parameters.twoxlarge >>
    description: "Build snarkos in release mode"
    steps:
      - fetch_repository:
          cache_size: 1G
          cache_key: install-snarkos-rust-1.83.0-cache
      - run:
          no_output_timeout: 20m
          command: |
            RUST_MIN_STACK=67108864 cargo install --path=. --offline
      - persist_to_workspace:
          root: /home/circleci
          paths:
            - .cargo
      - store_cache_with_cargo:
          cache_key: install-snarkos-rust-1.83.0-cache

  # Not used
  snarkos:
    executor: rust-docker
    resource_class: << pipeline.parameters.twoxlarge >>
    steps:
      - run_test:
          workspace_member: snarkos

  account:
    executor: rust-docker
    resource_class: << pipeline.parameters.medium >>
    steps:
      - run_test:
          workspace_member: snarkos-account

  cli:
    executor: rust-docker
    resource_class: << pipeline.parameters.twoxlarge >>
    steps:
      - run_test:
          workspace_member: snarkos-cli

  node:
    executor: rust-docker
    resource_class: << pipeline.parameters.twoxlarge >>
    steps:
      - run_test:
          workspace_member: snarkos-node
          extra_build_flags: "-j2"
=======
    resource_class: << pipeline.parameters.twoxlarge >>
    steps:
      - run_test:
          workspace_member: snarkos-cli

  # Not used
  display:
    executor: rust-docker
    resource_class: << pipeline.parameters.medium >>
    steps:
      - run_test:
          workspace_member: snarkos-display

  # Tests the top-level snarkos package
  node:
    executor: rust-docker
    resource_class: << pipeline.parameters.twoxlarge >>
    steps:
      - run_test:
          workspace_member: snarkos-node

  node-bft:
    executor: rust-docker
    resource_class: << pipeline.parameters.twoxlarge >>
    steps:
      - run_test:
          workspace_member: snarkos-node-bft

  node-bft-events:
    executor: rust-docker
    resource_class: << pipeline.parameters.medium >>
    steps:
      - run_test:
          workspace_member: snarkos-node-bft-events

  node-bft-ledger-service:
    executor: rust-docker
    resource_class: << pipeline.parameters.medium >>
    steps:
      - run_test:
          workspace_member: snarkos-node-bft-ledger-service

  node-bft-storage-service:
    executor: rust-docker
    resource_class: << pipeline.parameters.medium >>
    steps:
      - run_test:
          workspace_member: snarkos-node-bft-storage-service

  node-cdn:
    executor: rust-docker
    resource_class: << pipeline.parameters.medium >>
    steps:
      - run_test:
          workspace_member: snarkos-node-cdn

  node-consensus:
    executor: rust-docker
    resource_class: << pipeline.parameters.large >>
    steps:
      - run_test:
          workspace_member: snarkos-node-consensus

  node-rest:
    executor: rust-docker
    resource_class: << pipeline.parameters.medium >>
    steps:
      - run_test:
          workspace_member: snarkos-node-rest

  node-router:
    executor: rust-docker
    resource_class: << pipeline.parameters.large >>
    steps:
      - run_test:
          workspace_member: snarkos-node-router

  node-router-messages:
    executor: rust-docker
    resource_class: << pipeline.parameters.large >>
    steps:
      - run_test:
          workspace_member: snarkos-node-router-messages

  node-sync:
    executor: rust-docker
    resource_class: << pipeline.parameters.xlarge >>
    steps:
      - run_test:
          workspace_member: snarkos-node-sync

  # Not used
  node-sync-communication-service:
    executor: rust-docker
    resource_class: << pipeline.parameters.medium >>
    steps:
      - run_test:
          workspace_member: snarkos-node-sync-communication-service

  node-sync-locators:
    executor: rust-docker
    resource_class: << pipeline.parameters.medium >>
    steps:
      - run_test:
          workspace_member: snarkos-node-sync-locators

  node-tcp:
    executor: rust-docker
    resource_class: << pipeline.parameters.medium >>
    steps:
      - run_test:
          workspace_member: snarkos-node-tcp

  devnet-test:
    executor: rust-docker
    resource_class: << pipeline.parameters.xlarge >>
    steps:
      - run_devnet:
          workspace_member: .
          cache_key: v4.0.0-rust-1.88.0-devnet-test-cache

  # Check crates that do not have any tests individually
  check-other-crates:
    executor: rust-docker
    resource_class: << pipeline.parameters.medium >>
    steps:
      - checkout
      - setup_environment:
          cache_key: v3.3.1-rust-1.88.0-check-other-crates-cache
      - run:
          name: Check snarkos-node-metrics crate
          no_output_timeout: 10m
          command: cargo check --package=snarkos-node-metrics --all-features
      - run:
          name: Check snarkos-display crate
          no_output_timeout: 10m
          command: cargo check --package=snarkos-node-metrics --all-features
      - run:
          name: Check snarkos-node-sync-communication-servic3 crate
          no_output_timeout: 10m
          command: cargo check --package=snarkos-node-sync-communication-service --all-features
       - clear_environment:
          cache_key: v3.3.1-rust-1.88.0-check-other-crates-cache

  devnet-sync-test:
    executor: rust-docker
    resource_class: << pipeline.parameters.large >>
    steps:
      - set_environment_vars
      - attach_workspace:
          at: /home/circleci
      - run:
          name: "Setup GCP"
          command: |
            curl https://packages.cloud.google.com/apt/doc/apt-key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/cloud.google.gpg
            echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" | sudo tee -a /etc/apt/sources.list.d/google-cloud-sdk.list
            sudo apt-get update
            sudo apt-get install google-cloud-cli -y
            echo "$GCLOUD_SERVICE_KEY" > /home/circleci/gcloud-key.json
            gcloud auth activate-service-account --key-file=~/gcloud-key.json
      - run:
          name: "Fetch Data"
          command: |
            gcloud config set project protocol-development-sandbox
            gcloud storage cp gs://ci_testdata/sync-ledger.zip .
            unzip sync-ledger.zip
      - run:
          name: "Run Sync Test"
          command: ./.circleci/devnet_sync_ci.sh

  check-fmt:
    executor: rust-docker
    resource_class: << pipeline.parameters.medium >>
    steps:
      - set_environment_vars
      - attach_workspace:
          at: /home/circleci
      - install_rust_nightly
      - setup_environment:
          cache_key: v4.0.0-rust-1.88.0-fmt-cache
      - run:
          name: Check style
          no_output_timeout: 35m
          command: cargo +nightly fmt --all -- --check
      - clear_environment:
          cache_key: v4.0.0-rust-1.88.0-fmt-cache

  check-unused-dependencies:
    executor: rust-docker
    resource_class: << pipeline.parameters.medium >>
    steps:
      - checkout
      - setup_environment:
          cache_key: v4.0.0-rust-1.88.0-machete-cache
      - run:
          name: Check for unused dependencies
          no_output_timeout: 10m
          command: |
            cargo install cargo-machete@0.7.0
            cargo machete
      - clear_environment:
          cache_key: v4.0.0-rust-1.88.0-machete-cache

  check-cargo-audit:
    executor: rust-docker
    resource_class: << pipeline.parameters.medium >>
    steps:
      - checkout
      - setup_environment:
          cache_key: v4.0.0-rust-1.88.0-cargo-audit-cache
      - run:
          name: Check for security vulnerabilities
          no_output_timeout: 10m
          command: |
            cargo install cargo-audit@0.21.2 --locked
            cargo audit -D warnings
      - clear_environment:
          cache_key: v4.0.0-rust-1.88.0-cargo-audit-cache

  check-clippy:
    executor: rust-docker
    resource_class: << pipeline.parameters.medium >>
    steps:
      - checkout
      - setup_environment:
          cache_key: v4.0.O-rust-1.88.0-clippy-cache
     - run:
          name: Check lint
          no_output_timeout: 15m
          command: |
            cargo clippy --workspace --all-targets -- -D warnings
            cargo clippy --workspace --all-targets --all-features -- -D warnings
      - clear_environment:
          cache_key: v4.0.0-rust-1.88.0-clippy-cache

  verify-windows:
    executor:
      name: windows/default
      size: xlarge
    environment:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    parameters:
      workspace_member:
        type: string
    steps:
      - check_windows:
          workspace_member: << parameters.workspace_member >>


workflows:
  version: 2

  main-workflow:
    jobs:
      # Get the code and dependencies
      - prepare-repository

      # Generate pre-built binaries
      - install-snarkos:
          requires:
            - prepare-repository

      # Unit and Integration Tests
      - account:
          requires:
            - prepare-repository
      - cli:
          requires:
            - prepare-repository

      - snarkos:
          requires:
            - prepare-repository

      - node:
          requires:
            - prepare-repository
      - node-bft:
          requires:
            - prepare-repository
      - node-bft-events:
          requires:
            - prepare-repository
      - node-bft-ledger-service:
          requires:
            - prepare-repository
      - node-bft-storage-service:
          requires:
            - prepare-repository
      - node-cdn:
          requires:
            - prepare-repository
      - node-consensus:
          requires:
            - prepare-repository
      - node-router:
          requires:
            - prepare-repository
      - node-router-messages:
          requires:
            - prepare-repository
      - node-sync:
          requires:
            - prepare-repository
      - node-sync-locators:
          requires:
            - prepare-repository
      - node-tcp:
          requires:
            - prepare-repository
      - node-rest:
          requires:
            - prepare-repository

      # Lints and Checks
      - check-fmt:
          requires:
            - prepare-repository
      - check-unused-dependencies:
          requires:
            - prepare-repository
      - check-other-crates:
          requires:
            - prepare-repository
       - check-cargo-audit:
          requires:
            - prepare-repository
      - check-clippy:
          requires:
            - prepare-repository

      # Devnet Tests
      - devnet-test:
          requires:
            - install-snarkos
      - devnet-sync-test:
          requires:
            - install-snarkos

  windows-workflow:
    jobs:
      - verify-windows:
          matrix:
            parameters:
              workspace_member: [
                account,
                cli,
                display,
                node
              ]
