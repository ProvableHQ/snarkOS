version: 2.1

parameters:
  medium:
    type: string
    default: medium
  large:
    type: string
    default: large
  xlarge:
    type: string
    default: xlarge
  twoxlarge:
    type: string
    default: 2xlarge

orbs:
  windows: circleci/windows@5.0

executors:
  # The default docker image used in the main-workflow
  rust-docker:
     docker:
      # Attention: The docker file should be rebuilt whenever the rust toolchain
      # (or another dependency is updated)
      - image: cskama/snarkos-ci:4.0.0
 
commands:
  check_windows:
    description: "Runs cargo check on Windows"
    parameters:
      workspace_member:
        type: string
    steps:
      - checkout
      - restore_cache:
          key: cargo-cache-{{ arch }}-{{ checksum "Cargo.lock" }}
      - run:
          name: "Install Rust and run cargo check"
          command: |
            $ProgressPreference = "SilentlyContinue"
            # Remove the circleci installed rustc.
            choco uninstall rust
            # Install llvm (libclang for rocksdb).
            choco install llvm -y 
            refreshenv
            # Install rust with rustup.
            Invoke-WebRequest -Uri "https://win.rustup.rs/" -OutFile "C:\rustup-init.exe"
            & C:\rustup-init.exe -y --default-toolchain "1.88.0-x86_64-pc-windows-msvc" --no-modify-path --profile minimal # Attention - Change the MSRV in Cargo.toml and rust-toolchain as well
            $Env:Path += ";$Env:USERPROFILE\.cargo\bin"
            # Verify the installation.
            cargo --version --verbose
            rustc --version | Out-File -FilePath "rust-version"
            if (!(Test-Path "Cargo.lock" -PathType Leaf)) {
                cargo generate-lockfile
            }
            cd << parameters.workspace_member >>
            cargo check --examples --benches --tests
      - save_cache:
          paths:
            - C:\Users\circleci\.cargo\registry
            - C:\Users\circleci\.cargo\git
            - target
          key: cargo-cache-{{ arch }}-{{ checksum "rust-version" }}-{{ checksum "Cargo.lock" }}

  setup_environment:
    description: "Setup testing environment"
    parameters:
      cache_key:
        type: string
        default: v4.0.0-rust-1.88.0-snarkos-stable-cache
    steps:
      - run: set -e
      - run:
          name: Prepare Environment
          command: |
            export SCCACHE_CACHE_SIZE=200M
            export WORK_DIR="$CIRCLE_WORKING_DIRECTORY/.cache/sccache"
            export SCCACHE_DIR="$CIRCLE_WORKING_DIRECTORY/.cache/sccache"
            export RUSTC_WRAPPER="sccache"
      - restore_cache:
          keys:
            - << parameters.cache_key >>

  clear_environment:
    description: "Clear environment"
    parameters:
      cache_key:
        type: string
        default: v4.0.0-rust-1.88.0-snarkos-stable-cache
    steps:
      - run: (sccache -s||true)
      - run: set +e
      - save_cache:
          key: << parameters.cache_key >>
          paths:
            - .cache/sccache
            - .cargo

  run_serial:
    description: "Build and run tests"
    parameters:
      workspace_member:
        type: string
      cache_key:
        type: string
      flags:
        type: string
        default: ""
    steps:
      - checkout
      - setup_environment:
          cache_key:  v4.0.0-rust-1.88.0-<< parameters.cache_key >>-cache
      - run:
          no_output_timeout: 30m
          command: cd << parameters.workspace_member >> && RUST_MIN_STACK=67108864 cargo test << parameters.flags >>
      - clear_environment:
          cache_key: v4.0.0-rust-1.88.0-<< parameters.cache_key >>-cache

  run_serial_long:
    description: "Build and run long running tests"
    parameters:
      workspace_member:
        type: string
      cache_key:
        type: string
      flags:
        type: string
        default: ""
    steps:
      - checkout
      - setup_environment:
          cache_key: << parameters.cache_key >>
      - run:
          no_output_timeout: 300m
          command: cd << parameters.workspace_member >> && RUST_MIN_STACK=67108864 cargo test << parameters.flags >>
      - clear_environment:
          cache_key: << parameters.cache_key >>

  run_devnet:
    description: "Run devnet for integration testing"
    parameters:
      workspace_member:
        type: string
      cache_key:
        type: string
      validators:
        type: integer
        default: 4
      clients:
        type: integer
        default: 2
      network_id:
        type: integer
        default: 0
      min_height:
        type: integer
        default: 45
    steps:
      - checkout
      - setup_environment:
          cache_key: << parameters.cache_key >>
      - run:
          name: "Install snarkos"
          command: |
            cargo install --locked --path .
      - run:
          name: "Run DB backup test"
          timeout: 10m  # Allow 10 minutes total
          command: |
            ./.circleci/db_backup_ci.sh # run the db checkpoint test script first, and clean the dev ledgers afterwards
            snarkos clean --dev 0
            snarkos clean --dev 1
            snarkos clean --dev 2
            snarkos clean --dev 3
      - run:
          name: "Run block advancement test"
          imeout: 20m  # Allow 20 minutes total
          command: |
            ./.circleci/devnet_ci.sh << parameters.validators >> << parameters.clients >> << parameters.network_id >> << parameters.min_height >>
      - clear_environment:
          cache_key: << parameters.cache_key >>

jobs:
  snarkos:
    executor: rust-docker
    resource_class: << pipeline.parameters.large >>
    steps:
      - run_serial:
          workspace_member: .
          cache_key: stable

  account:
    executor: rust-docker
    resource_class: << pipeline.parameters.medium >>
    steps:
      - run_serial:
          workspace_member: account
          cache_key: account

  cli:
    executor: rust-docker
    resource_class: << pipeline.parameters.xlarge >>
    steps:
      - run_serial:
          workspace_member: cli
          cache_key: cli

  display:
    executor: rust-docker
    resource_class: << pipeline.parameters.medium >>
    steps:
      - run_serial:
          workspace_member: display
          cache_key: display

  node:
    executor: rust-docker
    resource_class: << pipeline.parameters.twoxlarge >>
    steps:
      - run_serial:
          workspace_member: node
          cache_key: node

  node-bft:
    executor: rust-docker
    resource_class: << pipeline.parameters.twoxlarge >>
    steps:
      - run_serial:
          workspace_member: node/bft
          cache_key: node-bft

  node-bft-events:
    executor: rust-docker
    resource_class: << pipeline.parameters.large >>
    steps:
      - run_serial:
          workspace_member: node/bft/events
          cache_key: node-bft-events

  node-bft-ledger-service:
    executor: rust-docker
    resource_class: << pipeline.parameters.medium >>
    steps:
      - run_serial:
          workspace_member: node/bft/ledger-service
          cache_key: node-bft-ledger-service

  node-bft-storage-service:
    executor: rust-docker
    resource_class: << pipeline.parameters.medium >>
    steps:
      - run_serial:
          workspace_member: node/bft/storage-service
          cache_key: node-bft-storage-service

  node-cdn:
    executor: rust-docker
    resource_class: << pipeline.parameters.medium >>
    steps:
      - run_serial:
          workspace_member: node/cdn
          cache_key: node-cdn

  node-consensus:
    executor: rust-docker
    resource_class: << pipeline.parameters.medium >>
    steps:
      - run_serial:
          workspace_member: node/consensus
          cache_key: node-consensus

  node-rest:
    executor: rust-docker
    resource_class: << pipeline.parameters.medium >>
    steps:
      - run_serial:
          workspace_member: node/rest
          cache_key: node-rest

  node-router:
    executor: rust-docker
    resource_class: << pipeline.parameters.large >>
    steps:
      - run_serial:
          workspace_member: node/router
          cache_key: node-router

  node-router-messages:
    executor: rust-docker
    resource_class: << pipeline.parameters.large >>
    steps:
      - run_serial:
          workspace_member: node/router/messages
          cache_key: node-router-messages-

  node-sync:
    executor: rust-docker
    resource_class: << pipeline.parameters.xlarge >>
    steps:
      - run_serial:
          workspace_member: node/sync
          cache_key: node-sync

  node-sync-communication-service:
    executor: rust-docker
    resource_class: << pipeline.parameters.medium >>
    steps:
      - run_serial:
          workspace_member: node/sync/communication-service
          cache_key: node-sync-communication-service

  node-sync-locators:
    executor: rust-docker
    resource_class: << pipeline.parameters.medium >>
    steps:
      - run_serial:
          workspace_member: node/sync/locators
          cache_key: node-sync-locators

  node-tcp:
    executor: rust-docker
    resource_class: << pipeline.parameters.medium >>
    steps:
      - run_serial:
          workspace_member: node/tcp
          cache_key: node-tcp

  devnet-test:
    executor: rust-docker
    resource_class: << pipeline.parameters.xlarge >>
    steps:
      - run_devnet:
          workspace_member: .
          cache_key: v3.3.1-rust-1.88.0-devnet-test-cache

  check-fmt:
    executor: rust-docker
    resource_class: << pipeline.parameters.medium >>
    steps:
      - checkout
      - setup_environment:
          cache_key: v3.3.1-rust-1.88.0-fmt-cache
      - run:
          name: Check style
          no_output_timeout: 35m
          command: cargo +nightly fmt --all -- --check
      - clear_environment:
          cache_key: v3.3.1-rust-1.88.0-fmt-cache

  check-unused-dependencies:
    executor: rust-docker
    resource_class: << pipeline.parameters.medium >>
    steps:
      - checkout
      - setup_environment:
          cache_key: v3.3.1-rust-1.88.0-machete-cache
      - run:
          name: Check for unused dependencies
          no_output_timeout: 10m
          command: cargo machete
      - clear_environment:
          cache_key: v3.3.1-rust-1.88.0-machete-cache

  check-cargo-audit:
    executor: rust-docker
    resource_class: << pipeline.parameters.medium >>
    steps:
      - checkout
      - setup_environment:
          cache_key: v3.3.1-rust-1.88.0-cargo-audit-cache
      - run:
          name: Check for security vulnerabilities
          no_output_timeout: 10m
          command: cargo audit -D warnings
      - clear_environment:
          cache_key: v3.3.1-rust-1.88.0-cargo-audit-cache

  check-clippy:
    executor: rust-docker
    resource_class: << pipeline.parameters.medium >>
    steps:
      - checkout
      - setup_environment:
          cache_key: v3.3.1-rust-1.88.0-clippy-cache
      - run:
          name: Check lint
          no_output_timeout: 35m
          command: |
            cargo clippy --workspace --all-targets -- -D warnings
            cargo clippy --workspace --all-targets --all-features -- -D warnings
      - clear_environment:
          cache_key: v3.3.1-rust-1.88.0-clippy-cache

  verify-windows:
    executor:
      name: windows/default
      size: xlarge
    environment:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    parameters:
      workspace_member:
        type: string
    steps:
      - check_windows:
          workspace_member: << parameters.workspace_member >>

workflows:
  version: 2

  main-workflow:
    jobs:
      - snarkos
      - account
      - cli
      - display
      - node
      - node-bft
      - node-bft-events
      - node-bft-ledger-service
      - node-bft-storage-service
      - node-cdn
      - node-consensus
      - node-rest
      - node-router
      - node-router-messages
      - node-sync
      - node-sync-communication-service
      - node-sync-locators
      - node-tcp
      - check-fmt
      - check-clippy
      - check-unused-dependencies
      - check-cargo-audit
      - devnet-test

  windows-workflow:
    jobs:
      - verify-windows:
          matrix:
            parameters:
              workspace_member: [
                account,
                cli,
                display,
                node
              ]
      
