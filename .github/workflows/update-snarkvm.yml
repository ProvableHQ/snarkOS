name: Update snarkVM dependency

on:
  schedule:
    # Run every hour to check for new commits in snarkVM staging
    - cron: '0 * * * *'
  workflow_dispatch:
    # Allow manual triggering

env:
  RUST_BACKTRACE: 1

jobs:
  update-snarkvm:
    name: Update snarkVM to latest staging
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout snarkOS
        uses: actions/checkout@v5
        with:
          ref: staging
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest snarkVM staging commit
        id: snarkvm-commit
        uses: actions/github-script@v7
        with:
          script: |
            // Get the latest commit hash from snarkVM staging branch
            const { data: branch } = await github.rest.repos.getBranch({
              owner: 'ProvableHQ',
              repo: 'snarkVM',
              branch: 'staging'
            });
            
            const latestCommit = branch.commit.sha;
            console.log('Latest snarkVM staging commit:', latestCommit);
            core.setOutput('latest_commit', latestCommit);
            
            // Get current commit from Cargo.toml
            const fs = require('fs');
            const cargoToml = fs.readFileSync('Cargo.toml', 'utf8');
            const revMatch = cargoToml.match(/^rev = "([^"]+)"/m);
            const currentCommit = revMatch ? revMatch[1] : '';
            console.log('Current snarkVM commit:', currentCommit);
            core.setOutput('current_commit', currentCommit);
            
            // Check if update is needed
            if (latestCommit !== currentCommit) {
              console.log('Update needed');
              core.setOutput('update_needed', 'true');
            } else {
              console.log('No update needed');
              core.setOutput('update_needed', 'false');
            }

      - name: Setup Git
        if: steps.snarkvm-commit.outputs.update_needed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create or checkout snarkvm-update branch
        if: steps.snarkvm-commit.outputs.update_needed == 'true'
        run: |
          # Check if snarkvm-update branch exists
          if git ls-remote --exit-code --heads origin snarkvm-update; then
            echo "Branch snarkvm-update exists, checking it out"
            git fetch origin snarkvm-update
            git checkout snarkvm-update
            # Reset to latest staging to ensure we're up to date
            git reset --hard origin/staging
          else
            echo "Creating new branch snarkvm-update from staging"
            git checkout -b snarkvm-update
          fi

      - name: Update snarkVM dependency
        if: steps.snarkvm-commit.outputs.update_needed == 'true'
        run: |
          # Update the rev in Cargo.toml
          sed -i 's/rev = "[^"]*"/rev = "${{ steps.snarkvm-commit.outputs.latest_commit }}"/' Cargo.toml
          
          # Verify the change was made
          echo "Updated Cargo.toml:"
          grep -A 5 -B 5 "snarkvm" Cargo.toml | grep -A 3 -B 3 "rev = "

      - name: Commit and push changes
        if: steps.snarkvm-commit.outputs.update_needed == 'true'
        run: |
          git add Cargo.toml
          git commit --no-verify -m "Update snarkVM to latest staging commit ${{ steps.snarkvm-commit.outputs.latest_commit }}"
          git push origin snarkvm-update