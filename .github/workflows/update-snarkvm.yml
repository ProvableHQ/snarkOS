# This workflow monitors the ProvableHQ/snarkVM staging branch for new commits
# and automatically creates PRs to update the snarkVM git dependency in snarkOS.
# It runs every 6 hours and can also be triggered manually.

name: Update snarkVM dependency

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allow manual triggering

jobs:
  check-snarkvm-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout snarkOS repository
        uses: actions/checkout@v4
        with:
          ref: staging
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Get current snarkVM commit
        id: current-commit
        run: |
          CURRENT_REV=$(grep -o 'rev = "[^"]*"' Cargo.toml | sed 's/rev = "//;s/"//')
          echo "current_rev=$CURRENT_REV" >> $GITHUB_OUTPUT
          echo "Current snarkVM revision: $CURRENT_REV"

      - name: Get latest snarkVM staging commit
        id: latest-commit
        run: |
          LATEST_REV=$(git ls-remote https://github.com/ProvableHQ/snarkVM.git staging | cut -f1)
          echo "latest_rev=$LATEST_REV" >> $GITHUB_OUTPUT
          echo "Latest snarkVM staging revision: $LATEST_REV"

      - name: Check if update is needed
        id: check-update
        run: |
          if [ "${{ steps.current-commit.outputs.current_rev }}" != "${{ steps.latest-commit.outputs.latest_rev }}" ]; then
            echo "update_needed=true" >> $GITHUB_OUTPUT
            echo "Update needed: ${{ steps.current-commit.outputs.current_rev }} -> ${{ steps.latest-commit.outputs.latest_rev }}"
          else
            echo "update_needed=false" >> $GITHUB_OUTPUT
            echo "No update needed"
          fi

      - name: Install Rust
        if: steps.check-update.outputs.update_needed == 'true'
        uses: dtolnay/rust-toolchain@1.88

      - name: Install required packages
        if: steps.check-update.outputs.update_needed == 'true'
        run: sudo apt install -y lld

      - name: Update snarkVM dependency
        if: steps.check-update.outputs.update_needed == 'true'
        run: |
          # Update the revision in Cargo.toml
          sed -i "s/rev = \"[^\"]*\"/rev = \"${{ steps.latest-commit.outputs.latest_rev }}\"/" Cargo.toml
          
          # Verify the change
          echo "Updated Cargo.toml snarkVM dependency:"
          grep -A 3 -B 1 'rev = ' Cargo.toml

      - name: Set up Rust build caching
        if: steps.check-update.outputs.update_needed == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Test compilation
        if: steps.check-update.outputs.update_needed == 'true'
        run: |
          echo "Testing compilation with updated snarkVM..."
          cargo check --workspace --all-targets
          echo "Compilation successful!"

      - name: Get commit details
        if: steps.check-update.outputs.update_needed == 'true'
        id: commit-details
        run: |
          # Get the commit message and short hash for the PR title
          COMMIT_INFO=$(git ls-remote --heads https://github.com/ProvableHQ/snarkVM.git staging | head -1)
          SHORT_HASH=$(echo "${{ steps.latest-commit.outputs.latest_rev }}" | cut -c1-8)
          echo "short_hash=$SHORT_HASH" >> $GITHUB_OUTPUT
          
          # Get more details about the commit
          COMMIT_MSG=$(curl -s https://api.github.com/repos/ProvableHQ/snarkVM/commits/${{ steps.latest-commit.outputs.latest_rev }} | jq -r '.commit.message' | head -1)
          echo "commit_msg=$COMMIT_MSG" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check-update.outputs.update_needed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "deps: update snarkVM to ${{ steps.commit-details.outputs.short_hash }}"
          title: "Update snarkVM dependency to ${{ steps.commit-details.outputs.short_hash }}"
          body: |
            ## 🔄 snarkVM Dependency Update
            
            This PR updates the snarkVM dependency to the latest commit from the `staging` branch.
            
            **Changes:**
            - Updated snarkVM revision from `${{ steps.current-commit.outputs.current_rev }}` to `${{ steps.latest-commit.outputs.latest_rev }}`
            - Latest commit: ${{ steps.commit-details.outputs.commit_msg }}
            
            **Commit Details:**
            - Repository: [ProvableHQ/snarkVM](https://github.com/ProvableHQ/snarkVM)
            - Branch: `staging`
            - Commit: [`${{ steps.commit-details.outputs.short_hash }}`](https://github.com/ProvableHQ/snarkVM/commit/${{ steps.latest-commit.outputs.latest_rev }})
            
            This update was automatically generated by the snarkVM dependency monitoring workflow.
            
            **Testing:**
            - ✅ Compilation check passed
            
            Please review and merge if the changes look good.
          branch: "deps/update-snarkvm-${{ steps.commit-details.outputs.short_hash }}"
          base: "staging"
          labels: |
            dependencies
            snarkvm
            automated
          assignees: ""
          reviewers: ""